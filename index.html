<!DOCTYPE html>
<html>
<head>
    <title>Mi IA - Lesly Simeón</title>
    <style>
        body { background: #2b2b2b; display: flex; justify-content: center; align-items: center; height: 100vh; font-family: Arial, sans-serif; }
        .caja { background: black; width: 400px; padding: 25px; border-radius: 20px; text-align: center; }
        .caja img { width: 110px; height: 110px; border-radius: 50%; border: 4px solid #ff1493; }
        .caja h1 { color: #ff1493; margin: 15px 0 5px 0; font-size: 26px; }
        .caja p { color: #ffb6d9; margin: 0 0 15px 0; font-size: 14px; }
        
        #chat { background: #fff0f5; height: 300px; overflow-y: auto; border-radius: 15px; padding: 15px; text-align: left; margin-bottom: 15px; }

        /* Tu mensaje */
        .tu-mensaje { color: #ff1493; font-weight: bold; text-align: right; margin: 10px 0 5px 0; }

        /* Respuesta de la IA - AQUÍ ESTÁ EL ARREGLO */
        .ia-mensaje {
            background: #3a3753;
            color: #ffffff !important; /* Color blanco para que se lea */
            font-weight: 400 !important; /* Ya no es negrita */
            padding: 12px;
            border-radius: 12px;
            margin-bottom: 15px;
            line-height: 1.5;
            font-size: 14px;
        }

        .input-area { display: flex; gap: 8px; }
        input { flex: 1; padding: 12px; border-radius: 20px; border: none; outline: none; }
        button { background: #ff1493; color: white; border: none; padding: 0 20px; border-radius: 20px; cursor: pointer; }
        button:hover { background: #ff4da6; }
    </style>
</head>
<body>
    <div class="caja">
        <img src="/static/lesly.jpg" alt="Lesly">
        <h1>Mi IA - Lesly Simeón 🖤💻</h1>
        <p>Tu Asistente Virtual - ¿En qué te puedo ayudar? ✨🔍✨</p>
        
        <div id="chat"></div>
        
        <div class="input-area">
            <input type="text" id="mensaje" placeholder="Escribe tu consulta aquí">
            <button onclick="enviar()">Enviar</button>
        </div>
    </div>

<script>
function enviar(){
    let texto = document.getElementById("mensaje").value;
    if(!texto) return;
    let chat = document.getElementById("chat");
    chat.innerHTML += `<div class="tu-mensaje">Tú: ${texto}</div>`;
    chat.innerHTML += `<div class="ia-mensaje" id="temp">IA Lesly: Escribiendo...</div>`;
    document.getElementById("mensaje").value = "";
    chat.scrollTop = chat.scrollHeight;

    fetch("/preguntar", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({mensaje: texto})
    })
    .then(res => res.json())
    .then(data => {
        document.getElementById("temp").remove();
        chat.innerHTML += `<div class="ia-mensaje">IA Lesly: ${data.respuesta}</div>`;
        chat.scrollTop = chat.scrollHeight;
    });
}
</script>
</body>
</html>
